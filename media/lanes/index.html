<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>hermes-lanes</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">lanes</span>
      <div>
        <h1>hermes-lanes</h1>
        <p id="home" class="muted">state.db를 읽는 중</p>
      </div>
    </div>
    <div class="controls">
      <div class="presets" id="presets">
        <button data-hours="6">6시간</button>
        <button data-hours="24">24시간</button>
        <button data-hours="168" class="on">7일</button>
        <button data-hours="720">30일</button>
        <button data-hours="0">전체</button>
      </div>
      <label>유휴 간격
        <select id="idle">
          <option value="30">30초</option>
          <option value="120" selected>2분</option>
          <option value="300">5분</option>
          <option value="900">15분</option>
        </select>
      </label>
      <button id="reload" type="button">다시 읽기</button>
    </div>
  </header>

  <section class="filters" id="filters">
    <div class="filter-row">
      <span class="filter-label">프로파일</span>
      <div id="filter-profile" class="chips"></div>
    </div>
    <div class="filter-row">
      <span class="filter-label">출처</span>
      <div id="filter-source" class="chips"></div>
    </div>
    <div class="filter-row playbar">
      <button id="play" type="button">재생</button>
      <button id="live" type="button">실시간</button>
      <label>한 바퀴
        <select id="play-span">
          <option value="24">24초</option>
          <option value="12" selected>12초</option>
          <option value="6">6초</option>
        </select>
      </label>
      <span id="play-time" class="muted"></span>
    </div>
    <div class="filter-row selects">
      <label>모델
        <select id="filter-model"><option value="">전체</option></select>
      </label>
      <label>역할
        <select id="filter-role">
          <option value="all">전체</option>
          <option value="root">루트만</option>
          <option value="child">서브에이전트만</option>
        </select>
      </label>
      <label>도구
        <select id="filter-tool"><option value="">전체</option></select>
      </label>
      <label>제목
        <input id="filter-q" type="search" placeholder="세션 제목" />
      </label>
      <button id="filter-clear" type="button">필터 지우기</button>
    </div>
  </section>

  <section class="stats" id="stats"></section>

  <section class="charts">
    <figure class="wide timeplot">
      <figcaption>동시 작업 <span>고른 세션의 작업 버스트가 겹친 수</span></figcaption>
      <svg id="chart-working" viewBox="0 0 1000 150" preserveAspectRatio="none"></svg>
      <i class="figure-playhead" hidden></i>
    </figure>
    <figure class="wide timeplot">
      <figcaption>출처별 동시 작업 <span>같은 시간축. 선을 누르면 그 출처만 남습니다</span></figcaption>
      <svg id="chart-source" viewBox="0 0 1000 150" preserveAspectRatio="none"></svg>
      <div id="source-legend" class="legend-row"></div>
      <i class="figure-playhead" hidden></i>
    </figure>
    <figure class="slim wide timeplot">
      <figcaption>열린 세션 수명 <span>시작부터 마지막 활동까지. 노는 시간도 포함</span></figcaption>
      <svg id="chart-open" viewBox="0 0 1000 80" preserveAspectRatio="none"></svg>
      <i class="figure-playhead" hidden></i>
    </figure>
  </section>

  <section class="chart-grid">
    <figure>
      <figcaption>출처별 작업 시간</figcaption>
      <svg id="chart-source-bar" viewBox="0 0 420 220"></svg>
    </figure>
    <figure>
      <figcaption>오래 걸린 세션</figcaption>
      <svg id="chart-sessions" viewBox="0 0 420 220"></svg>
    </figure>
    <figure>
      <figcaption>도구 시간</figcaption>
      <svg id="chart-tools" viewBox="0 0 420 220"></svg>
    </figure>
    <figure>
      <figcaption>버스트 길이</figcaption>
      <svg id="chart-hist" viewBox="0 0 420 220"></svg>
    </figure>
  </section>

  <div class="split">
    <section class="gantt-wrap">
      <div class="axis" id="axis"></div>
      <div id="gantt"></div>
      <i id="gantt-playhead" class="figure-playhead" hidden></i>
    </section>
    <aside id="side">
      <h2>병목</h2>
      <div id="split-bar"></div>
      <h3>도구에 쓴 시간</h3>
      <div id="tools"></div>
      <h3>한 번에 오래 걸린 호출</h3>
      <ol id="slow"></ol>
      <h3>세션 안에서</h3>
      <div id="detail" class="muted">레인을 누르면 모델 대기와 도구 간격이 나옵니다. 프롬프트 본문은 읽지 않습니다.</div>
    </aside>
  </div>
  <script src="/app.js"></script>
</body>
</html>
